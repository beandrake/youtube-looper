<!DOCTYPE html>
<!-- Language=English -->
<html lang="en">     
	<head>
		<link rel="icon" href="data:,"> <!-- no favicon -->
		<meta charset="utf-8">       

		<!-- SEO -->
		<meta
			name="description"
			content="Simple webpage that auto-loops any YouTube video without ads."
		>

		<title>
		ToobLoop | Auto-loop a YouTube video ad-free
		</title>

		<link rel="stylesheet" href="./style.css">

	</head>
	<body>
		<div class="app">
		
			<div class="full-width">
				<p>ToobLoop - Repeats one video forever, without ads</p>
				
				<!-- The Embedded Video -->
				<iframe
					id="youtube-frame"
					width="560" height="315"
					frameborder="0"
					allowfullscreen
					src="https://www.youtube.com/embed/SRczGJ-4M5g?playlist=SRczGJ-4M5g&loop=1"
				>
				</iframe>
			</div>

			<div class="error-section">
				<!-- Error Display -->
				<button id="error-button">
					Clear Error
				</button>
				<p id="error-text"></p>
			</div>			
			
			<div class="flex-container">			
				<div class="left">

					<p>Selected Video:</p>
					<div class="button-box">
						<!-- Move Up button -->
						<button id="move-earlier-button">
							↑ Move ↑
						</button>
						<br/>
						<!-- Move Down button -->
						<button id="move-later-button">
							↓ Move ↓
						</button>
						<!-- Delete Video button -->
						<button id="delete-button">
							Delete
						</button>
					</div>
					
					<p>Video List:</p>
					<div class="button-box">
						<!-- Load Playlist button -->
						<button id="load-button">
							Load
						</button>

						<!-- Save Playlist button -->
						<button id="save-button">
							Save
						</button>

						<br/>
						<!-- Clear Playlist button -->
						<button id="clear-button">
							Clear
						</button>
					</div>
				</div>

				<div class="right card">
					<br/>
					<!-- Playlist-->
					<form id="playlist">
						<!-- video options will be populated here -->
					</form>

					<!-- Add Video to Playlist -->
					<form id="add-video-form">
						<input type="text" id="title-input" placeholder="Custom Title (optional)"><br/>
						<input type="text" id="url-input" placeholder="YouTube video URL"><br/>
						<button id="add-video-button">
							Add Video
						</button>
					</form>
				</div>

			</div>

		</div>

		<script type="module" src="./src/App.js"></script>
	</body>  
</html>
