<!DOCTYPE html>
<!-- Language=English -->
<html lang="en">     
	<head>
		<link rel="icon" href="data:,"> <!-- no favicon -->
		<meta charset="utf-8">       

		<!-- SEO -->
		<meta
			name="description"
			content="Simple webpage that auto-loops any YouTube video without ads."
		>

		<title>
		ToobLoop | Auto-loop YouTube videos ad-free
		</title>

	</head>
	<body>
		
		<iframe
			id="youtube-frame"
			width="560" height="315"
			src="https://www.youtube.com/embed/yTalKpnoyrM?playlist=yTalKpnoyrM&loop=1"
		>
		</iframe>
		<form id="playlist">
			<input type="radio" name="video-option" id="playlist-custom" value="custom" checked="checked">
  			<label for="playlist-custom">Paste any YouTube URL: <input id="user-url" type="text" name="custom-song-choice" /></label>
			<br>
		</form>
		<button id="add-button">Add Video</button>

		<script src="./scripts.js"></script>
	</body>  
</html>
