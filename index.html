<!DOCTYPE html>
<!-- Language=English -->
<html lang="en">     
	<head>
		<link rel="icon" href="data:,"> <!-- no favicon -->
		<meta charset="utf-8">       

		<!-- SEO -->
		<meta
			name="description"
			content="Simple webpage that auto-loops any YouTube video without ads."
		>

		<title>
		ToobLoop | Auto-loop a YouTube video ad-free
		</title>

	</head>
	<body>
		<p>ToobLoop - Repeats one video forever, without ads (playlist is just for convenience)</p>
		
		<!-- The Embedded Video -->
		<iframe
			id="youtube-frame"
			width="560" height="315"
			frameborder="0"
			allowfullscreen
			src="https://www.youtube.com/embed/yTalKpnoyrM?playlist=yTalKpnoyrM&loop=1"
		>
		</iframe>
		<br/>
		
		<!-- Error Display -->
		<button id="error-button">
			Clear Error
		</button>
		<b><p id="error-text" style="color:red;"></p></b>
		<br/>
		
		<!-- Playlist-->
		<form id="playlist">
			<!-- video options will be populated here -->
		</form>
		<p></p>
		
		<!-- Add Video to Playlist button -->
		<input type="text" id="title-input" placeholder="Title (optional)"><br/>
		<input type="text" id="url-input" placeholder="YouTube video URL"><br/>
		<button id="add-video-button">
			Add Video
		</button>
		<br/><br/>		
		
		<!-- Load Playlist button -->
		<button id="load-button">
			Load Playlist
		</button>

		<!-- Save Playlist button -->
		<button id="save-button">
            Save Playlist
        </button>

		<br/>
		<!-- Clear Playlist button -->
		<button id="clear-button">
			Clear Playlist
		</button>


		<script type="module" src="./src/App.js"></script>
	</body>  
</html>
